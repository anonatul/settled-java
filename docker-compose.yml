name: settled

services:
  postgres:
    image: postgres:16-alpine
    container_name: settled-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-settled}
      POSTGRES_USER: ${POSTGRES_USER:-settled}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-settled}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-settled} -d ${POSTGRES_DB:-settled}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - settled-net

  redis:
    image: redis:7-alpine
    container_name: settled-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - settled-net

  backend:
    build: ./backend
    container_name: settled-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-settled}
      DB_USERNAME: ${POSTGRES_USER:-settled}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-settled}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-settled-dev-secret-key-change-me-in-production-0123456789abcdef}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - settled-net

  frontend:
    build: ./frontend
    container_name: settled-frontend
    environment:
      PORT: 80
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - settled-net

volumes:
  postgres-data:
  uploads-data:

networks:
  settled-net:
    driver: bridge
