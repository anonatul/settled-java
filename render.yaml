# Render Blueprint — deploys the full Settled stack to Render.
# See DEPLOYMENT.md for the manual setup of Redis (Upstash) and secrets.
#
# Usage: push to GitHub, then in Render Dashboard:
#   New > Blueprint > connect the repository (settled-java) > Apply.
# Fill in the Upstash values and secrets marked below after the blueprint is created.

services:
  - type: web
    name: settled-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # Supabase Postgres connection string (postgresql://... or postgres://...).
      # Paste the full connection string from Supabase > Connect > "Connection string".
      # Use the "Pooler" (transaction mode) connection string for best results.
      # The app converts it to a JDBC URL and extracts user/password at boot.
      # NOTE: keep this secret; never commit the password to the repo.
      # After the blueprint is created, set DATABASE_URL in the backend's
      # Environment tab (Dashboard > settled-backend > Environment).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      # Uploaded claim documents are stored on the container's ephemeral disk
      # (they are lost on redeploy on the free plan). Upgrade to a paid plan +
      # persistent disk mounted at /app/uploads to persist them.
      - key: UPLOAD_DIR
        value: /app/uploads
      # ---- Upstash Redis (create a free database at https://console.upstash.com) ----
      # Set REDIS_HOST and REDIS_PASSWORD in the backend's Environment tab
      # after the blueprint is created (they are secrets).
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"

  - type: web
    name: settled-frontend
    runtime: docker
    rootDir: frontend
    plan: free
    # nginx in the container listens on $PORT and proxies /api to the backend URL.
    # property: host returns the bare hostname; the nginx template adds http://.
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: settled-backend
          property: host  # e.g. settled-backend.onrender.com (scheme added by nginx template)